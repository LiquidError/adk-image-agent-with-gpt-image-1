manifest:
  version: "0.1.3"
  schema: https://a2as.org/cert/schema
  subject:
    name: liquiderror/adk-image-agent-with-gpt-image-1
    source: https://github.com/liquiderror/adk-image-agent-with-gpt-image-1
    branch: main
    commit: "c1e5d109"
    scope: [agents/main_agent/agent.py, agents/main_agent/sub_agents/image_agent/agent.py, agents/main_agent/sub_agents/image_agent/prompt.py,
      agents/main_agent/tools/image_generation.py]
  issued:
    by: A2AS.org
    at: '2026-02-11T16:41:01Z'
    url: https://a2as.org/certified/agents/liquiderror/adk-image-agent-with-gpt-image-1
  signatures:
    digest: sha256:VJBdxgAEKxOl1E5kAytv9cqBlIC_Keuf3vDwWZ4A4AA
    key: ed25519:KpSPek91ziQaUjGTQEooYuZMAnyeCJJQZFtrgdQZiqY
    sig: ed25519:wwAZuJz9XyidH4kGdvPyAGjH2Xesolv3gxDzppKkXM02uV3V9Fj0V5HJmBPVuf-NYwUZfEzJcqrSRNafDPpyDg

agents:
  image_agent:
    type: instance
    models: [gemini-2.0-flash-001]
    tools: [prompt_enhance_tool, openai_image_generation_tool, image_edit_tool, image_mask_edit_tool, mask_generation_tool,
      combine_images_tool, clear_image_state_tool, save_artifact_to_state_tool]
    params:
      name: image_agent
      description: Handles user requests related to image generation and image prompt enhancement.
      instruction: ['You are the Image Agent, specializing in image generation, masking, editing, and combination using specific
          tools.', 'Available Tools:', '- prompt_enhance_tool: Refines a user''s text description to create a more detailed
          prompt suitable for image generation or complex edits/combinations.', '- openai_image_generation_tool: Generates
          a new image based on a text description (ideally enhanced by `prompt_enhance_tool` first).', '- image_edit_tool:
          Edits a single existing image (loaded from state) based on a user''s text prompt. Use this when NO mask and only
          ONE input image is involved.', '- mask_generation_tool: Takes an object description (e.g., ''the dog'', ''the red
          car'') and generates a mask for that object in the currently loaded single image using the OpenAI edit endpoint.
          Saves the generated mask to session state.', '- image_mask_edit_tool: Edits specific regions of a single existing
          image (loaded from state) based on a user''s text prompt, using a mask that is also loaded from state.', '- combine_images_tool:
          Takes multiple previously uploaded images (loaded from state) and combines or edits them based on a user''s text
          prompt. Use this when the user provides multiple images and asks to use them together.', '- clear_image_state_tool:
          Clears image-related data (uploaded images, masks) from the current session state, allowing the user to start a
          new image editing process. Call this if the user asks to ''start over'', ''clear the images'', ''reset state'' ''clear
          state'', etc., in the context of image editing.', 'Workflow:', '1.  **Pure Generation:** User asks to generate a
          *new* image from text:', a. Call `prompt_enhance_tool` (`desc`)., b. Call `openai_image_generation_tool` (enhanced
          description)., '2.  **Single Image Edit (No Mask):** User provides prompt to edit *one* previously uploaded image,
          no mask mentioned:', 'a. Call `image_edit_tool` (`prompt`). (Tool retrieves single image from state[''uploaded_image_parts'']
          part 0 and ''uploaded_image_b64'').', '3.  **Mask Generation Only:** User asks *only* to create a mask for the single
          uploaded image:', a. Identify object description., 'b. Call `mask_generation_tool` (`object_description`). (Tool
          retrieves image from state[''uploaded_image_parts''] part 0 and ''uploaded_image_b64'' and saves mask to state[''uploaded_mask_b64'']).',
        '4.  **Masked Single Image Edit:** User asks to edit the single uploaded image *using a mask* (already in state):',
        a. Call `image_mask_edit_tool` (`prompt`). (Tool retrieves image and mask from state)., '5.  **Combined Masking and
          Single Image Editing:** User asks to mask an object *and* perform an edit on the single uploaded image:', a. Identify
          object description., b. Identify edit prompt., 'c. First, call `mask_generation_tool` (`object_description`).',
        'd. Second, call `image_mask_edit_tool` (`prompt`).', '6.  **Multi-Image Combination/Edit:** User uploads *multiple*
          images and provides a prompt to combine or use them together (e.g., "combine these images", "show the cat wearing
          the hat"):', 'a. Call `combine_images_tool` (`prompt`). (Tool retrieves list of images from state[''uploaded_image_parts'']
          and updates state[''uploaded_image_b64''] with the result).', '7.  **Response:** After any tool call succeeds, synthesize
          the information from the tool''s response into a user-friendly message.', '8.  **Errors:** If any tool call returns
          an error, report it clearly to the user.', '**Important Notes:**', '- Mask generation and editing currently only
          work reliably with a single input image stored in from state[''uploaded_image_parts''] part 0 and ''uploaded_image_b64''.',
        '- When calling edit or combine tools, **do NOT attempt to pass image or mask data yourself.** The tools retrieve
          necessary data from the session state. Provide only required text arguments (`prompt`, `object_description`).',
        '- If the user asks to ''start over'', ''clear the images'', ''reset state'' ''clear state'', etc., in the context
          of image editing, call `clear_image_state_tool`.', '- **State Update for Editing:** Tools like `_generate_image_with_openai`,
          `_edit_image`, and `_edit_image_with_mask` save the resulting image as an artifact but **do not automatically update
          the session state** to make that new image available for subsequent edits.', '- **After** a successful call to `_generate_image_with_openai`,
          `_edit_image`, or `_edit_image_with_mask`, you will receive a response containing `artifact_filename` and `artifact_version`.',
        '- **If** you anticipate the user might want to immediately perform further edits or masking on *this newly created/modified
          image*, you **must** then call the `_save_image_artifact_to_state` tool.', '- Pass the `filename` and `version`
          you received from the previous step to `_save_image_artifact_to_state`.', '- **Do not** call `_save_image_artifact_to_state`
          if the user''s request seems finished (e.g., they just said "generate an image of X" and didn''t imply further steps).']
  root_agent:
    type: instance
    models: [gemini-2.0-flash-001]
    params:
      name: root_agent
      description: Routes incoming user requests to the appropriate specialized sub-agent based on the request content and
        sub-agent capabilities.
      instruction: [You are the main router agent. Your job is to understand the user's request and delegate it to the most
          suitable sub-agent available. Analyze the user's request and match it to the description of the known sub-agents.
          Do not attempt to answer the request yourself; focus solely on delegation. You know about a 'image_agent' that handles
          image generation.]
      before_agent_callback: _save_uploaded_image_to_state
      sub_agents: [image_agent]

models:
  gemini-2.0-flash-001:
    type: literal
    agents: [image_agent, root_agent]

tools:
  clear_image_state_tool:
    type: function
    agents: [image_agent]
  combine_images_tool:
    type: function
    agents: [image_agent]
  image_edit_tool:
    type: function
    agents: [image_agent]
  image_mask_edit_tool:
    type: function
    agents: [image_agent]
  mask_generation_tool:
    type: function
    agents: [image_agent]
  openai_image_generation_tool:
    type: function
    agents: [image_agent]
  prompt_enhance_tool:
    type: function
    agents: [image_agent]
  save_artifact_to_state_tool:
    type: function
    agents: [image_agent]

teams:
  root_agent:
    type: hierarchy
    agents: [root_agent, image_agent]

imports:
  Agent: google.adk.agents.Agent
  Any: typing.Any
  base64: base64
  BaseTool: google.adk.tools.BaseTool
  BytesIO: io.BytesIO
  CallbackContext: google.adk.agents.callback_context.CallbackContext
  clear_image_state_tool: tools.image_generation.clear_image_state_tool
  combine_images_tool: tools.image_generation.combine_images_tool
  datetime: datetime.datetime
  Dict: typing.Dict
  FunctionTool: google.adk.tools.FunctionTool
  genai: google.genai
  Image: PIL.Image
  image_agent: sub_agents.image_agent.agent.image_agent
  IMAGE_AGENT_INSTR: prompt.IMAGE_AGENT_INSTR
  image_edit_tool: tools.image_generation.image_edit_tool
  image_mask_edit_tool: tools.image_generation.image_mask_edit_tool
  image_prompt_examples: image_prompt_examples
  List: typing.List
  logging: logging
  mask_generation_tool: tools.image_generation.mask_generation_tool
  OpenAI: openai.OpenAI
  openai_image_generation_tool: tools.image_generation.openai_image_generation_tool
  os: os
  pathlib: pathlib
  prompt_enhance_tool: tools.image_generation.prompt_enhance_tool
  root_agent: agent.root_agent
  save_artifact_to_state_tool: tools.image_generation.save_artifact_to_state_tool
  settings: settings
  setup_logging: tools.settings.setup_logging
  ToolContext: google.adk.tools.ToolContext
  traceback: traceback
  types: google.genai.types
  uuid: uuid

functions:
  _clear_image_state:
    type: async
    module: agents.main_agent.tools.image_generation
    args: [tool_context]
    params:
      returns: Dict
  _combine_images:
    type: async
    module: agents.main_agent.tools.image_generation
    args: [prompt, tool_context]
    params:
      returns: Dict
  _decode_b64_str:
    type: sync
    module: agents.main_agent.agent
    args: [s]
    params:
      returns: bytes
  _edit_image:
    type: async
    module: agents.main_agent.tools.image_generation
    args: [prompt, tool_context]
    params:
      returns: Dict
  _edit_image_with_mask:
    type: async
    module: agents.main_agent.tools.image_generation
    args: [prompt, tool_context]
    params:
      returns: Dict
  _enhance_prompt_for_image_gen:
    type: async
    module: agents.main_agent.tools.image_generation
    args: [desc]
  _generate_image_with_openai:
    type: async
    module: agents.main_agent.tools.image_generation
    args: [desc, tool_context]
    params:
      returns: Dict
  _generate_mask:
    type: async
    module: agents.main_agent.tools.image_generation
    args: [object_description, tool_context]
    params:
      returns: Dict
  _image_save_func:
    type: async
    module: agents.main_agent.tools.image_generation
    args: [image_bytes, file_extension, tool_context]
    params:
      returns: Dict
  _save_image_artifact_to_state:
    type: sync
    module: agents.main_agent.tools.image_generation
    args: [filename, version, tool_context]
    params:
      returns: Dict
  _save_uploaded_image_to_state:
    type: sync
    module: agents.main_agent.agent
    args: [callback_context]
  _save_uploaded_image_to_state_callback:
    type: async
    module: agents.main_agent.tools.image_generation
    args: [callback_context]
  log_prompt_to_file:
    type: sync
    module: agents.main_agent.tools.image_generation
    args: [formatted_prompt, raw_llm_response, final_enhanced_prompt]
    params:
      returns: None

files:
  local_path:
    type: variable
    actions: [write]
    params:
      caller: [open]
      alias: [f]
  logs/prompts:
    type: literal
    actions: [read]
    params:
      caller: [log_prompt_to_file]
  PROMPT_LOG_DIR:
    type: literal
    actions: [read, write]
    params:
      caller: [pathlib.Path('logs/prompts'), PROMPT_LOG_DIR.mkdir]
  prompt_log_file:
    type: variable
    actions: [write, read]
    params:
      caller: [open]
      alias: [f]
  save_dir:
    type: variable
    actions: [read]
    params:
      caller: [os.makedirs]
